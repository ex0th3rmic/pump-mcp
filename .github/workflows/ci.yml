name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21
      - run: bun install --frozen-lockfile
      - name: Tests (Worker)
        run: bun test
      - name: Typecheck (tsc + svelte-check)
        run: bun run typecheck
      - name: Build (web app)
        run: bun run build
