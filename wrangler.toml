name = "pump-codemode-mcp"
# Deploys to the account `wrangler login` selected (or CLOUDFLARE_ACCOUNT_ID). Rename the Worker freely.
main = "src/index.ts"
compatibility_date = "2025-10-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
# Served on a Workers Custom Domain: wrangler creates the DNS record and certificate on deploy.
routes = [{ pattern = "pump-mcp.ex0therm.dev", custom_domain = true }]
upload_source_maps = true

# Code Mode runs model-written JavaScript inside a sandboxed Dynamic Worker. The sandbox has no
# network access of its own: every API call goes through `src/upstreams.ts` on the host, where
# secrets are attached. The LOADER binding is what spawns those sandboxes.
[[worker_loaders]]
binding = "LOADER"

# The web app (Svelte, source in ./web, built to ./dist by `vite build`) is served for
# every path the Worker does not handle itself (/mcp, /health, /openapi.json).
[assets]
directory = "./dist"
binding = "ASSETS"

# Plain vars. Secrets (never commit): `wrangler secret put MCP_BEARER_TOKEN` (required),
# `RPC_URL` (keyed Helius URL; enables /curve, /rpc and /trade), `PUMP_API_KEY` (official platform key,
# approval required), `PINATA_JWT` (enables POST /metadata).
[vars]
# Community mode upstreams (used while the official developer platform is not available).
PUMP_FRONTEND_API_ORIGIN = "https://frontend-api-v3.pump.fun"
# Official pump.fun Developer API (docs.pump.fun). The public OpenAPI document is merged with the
# community routes; its paths are forwarded to PUMP_API_ORIGIN with `Authorization: Bearer ${PUMP_API_KEY}`
# (secret; a pf_live_ key from the console at https://developers.pump.fun, approval required).
# Set PUMP_OPENAPI_URL = "" to serve the community routes only. Devnet: https://api-devnet.pump.fun/v1.
PUMP_OPENAPI_URL = "https://docs.pump.fun/openapi.public.json"
PUMP_API_ORIGIN = "https://api.pump.fun/v1"
# Address lookup tables /trade may compile with (comma separated). A create with a dev buy needs one to
# fit in a transaction. Make yours once with `bun run lookup-table --keypair <wallet.json> --yes`.
LOOKUP_TABLES = ""
# Gateway prefix for the IPFS links POST /metadata returns.
IPFS_GATEWAY = "https://ipfs.io/ipfs/"
# Coin whose bonding curve the web app shows on load (GET /api/showcase, public, cached 20s). Pick any
# live pump.fun mint; leave empty to show a static illustration instead.
SHOWCASE_MINT = "GPieo9s4rz6ungQnsqyiUrznqDypMgrNXmFSDM2vpump"
# JSON-RPC methods sandbox code may call through POST /rpc (comma separated).
RPC_ALLOWED_METHODS = "getAccountInfo,getBalance,getTokenAccountBalance,getTokenAccountsByOwner,getTokenLargestAccounts,getTokenSupply,getLatestBlockhash,getSignaturesForAddress,getTransaction,getMultipleAccounts,simulateTransaction,sendTransaction,getSignatureStatuses"
# Cluster shown by the web console and used for explorer links. Must match RPC_URL.
SOLANA_CLUSTER = "mainnet-beta"

# Optional usage counts (page views, MCP calls by tool name). Query with SQL in the dashboard or API;
# see "Usage stats" in the README. Remove this block to record nothing.
[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "pump_mcp_events"

[observability]
enabled = true
